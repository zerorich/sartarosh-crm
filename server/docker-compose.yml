services:
  postgres:
    image: postgres:16-alpine
    container_name: sartarosh-postgres
    environment:
      POSTGRES_USER: sartarosh
      POSTGRES_PASSWORD: sartarosh
      POSTGRES_DB: sartarosh
    ports:
      - "5432:5432"
    volumes:
      - sartarosh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sartarosh -d sartarosh"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sartarosh-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sartarosh_pgdata:
